<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sajib Saha — Software Engineer, Agentic AI and LLM Systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070b" />
      <stop offset="55%" stop-color="#0a1119" />
      <stop offset="100%" stop-color="#05070b" />
    </linearGradient>
    <radialGradient id="glowTeal" cx="79%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#63d2c6" stop-opacity="0.34" />
      <stop offset="45%" stop-color="#63d2c6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#63d2c6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber" cx="79%" cy="50%" r="20%">
      <stop offset="0%" stop-color="#ff9a4a" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#ff7832" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#ff7832" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="18%" cy="85%" r="42%">
      <stop offset="0%" stop-color="#7b61ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7b61ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#63d2c6" />
      <stop offset="55%" stop-color="#9580ff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="diskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9a4a" stop-opacity="0.15" />
      <stop offset="28%" stop-color="#ffe7c7" stop-opacity="0.95" />
      <stop offset="52%" stop-color="#ff8d3a" stop-opacity="0.85" />
      <stop offset="78%" stop-color="#63d2c6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#63d2c6" stop-opacity="0.1" />
    </linearGradient>
    <clipPath id="rounded">
      <rect x="0.5" y="0.5" width="1199" height="319" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="320" fill="url(#bg)" />
    <rect width="1200" height="320" fill="url(#glowViolet)" />
    <rect width="1200" height="320" fill="url(#glowTeal)" />
    <rect width="1200" height="320" fill="url(#glowAmber)" />

    <!-- Subtle starfield -->
    <g fill="#ffffff">
      <circle cx="95" cy="46" r="1.2" opacity="0.55" />
      <circle cx="215" cy="28" r="1" opacity="0.35" />
      <circle cx="380" cy="52" r="1.4" opacity="0.45" />
      <circle cx="540" cy="34" r="1" opacity="0.4" />
      <circle cx="670" cy="74" r="1.3" opacity="0.5" />
      <circle cx="745" cy="38" r="1" opacity="0.35" />
      <circle cx="885" cy="44" r="1.2" opacity="0.55" />
      <circle cx="1085" cy="52" r="1.5" opacity="0.6" />
      <circle cx="1142" cy="118" r="1.1" opacity="0.45" />
      <circle cx="1096" cy="264" r="1.3" opacity="0.5" />
      <circle cx="772" cy="276" r="1" opacity="0.4" />
      <circle cx="612" cy="262" r="1.2" opacity="0.45" />
      <circle cx="442" cy="288" r="1" opacity="0.35" />
      <circle cx="152" cy="278" r="1.3" opacity="0.4" />
      <circle cx="64" cy="196" r="1" opacity="0.35" />
    </g>

    <!-- Stylized Gargantua / Orbital Motif (Right) -->
    <g transform="translate(950, 162)">
      <!-- Outer orbital guides -->
      <circle cx="0" cy="0" r="122" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="3 6" />
      <circle cx="0" cy="0" r="88" fill="none" stroke="#63d2c6" stroke-opacity="0.18" />
      <!-- Lensed photon ring -->
      <circle cx="0" cy="0" r="56" fill="none" stroke="#ffd8a8" stroke-opacity="0.55" stroke-width="2" />
      <circle cx="0" cy="0" r="62" fill="none" stroke="#ff9a4a" stroke-opacity="0.22" stroke-width="5" />
      <!-- Accretion disk back -->
      <ellipse cx="0" cy="0" rx="158" ry="30" fill="none" stroke="url(#diskGrad)" stroke-width="3.5" transform="rotate(-14)" opacity="0.85" />
      <ellipse cx="0" cy="0" rx="132" ry="22" fill="none" stroke="url(#diskGrad)" stroke-width="1.6" transform="rotate(-14)" opacity="0.65" />
      <!-- Event horizon -->
      <circle cx="0" cy="0" r="48" fill="#020305" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2" />
      <!-- Accretion disk front highlight -->
      <path d="M -150 37 A 158 30 -14 0 0 150 -37" fill="none" stroke="url(#diskGrad)" stroke-width="4.5" stroke-linecap="round" />
      <!-- Orbiting nodes -->
      <circle cx="88" cy="-42" r="4" fill="#63d2c6" />
      <circle cx="-98" cy="64" r="3" fill="#9580ff" />
    </g>

    <!-- Editorial Header HUD -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <circle cx="72" cy="58" r="4" fill="#63d2c6" />
      <text x="86" y="62" font-size="12" letter-spacing="3.2" fill="#63d2c6">SOFTWARE ENGINEER @ THERAP (BD)</text>
      <text x="580" y="62" font-size="11" letter-spacing="2.6" fill="#ffffff" fill-opacity="0.45">DHAKA · 23.81°N 90.41°E</text>
    </g>

    <!-- Main Name & Title -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
      <text x="68" y="138" font-size="56" font-weight="700" letter-spacing="-1.2" fill="#ffffff">Sajib Saha</text>
      <text x="70" y="178" font-size="22" font-weight="500" fill="#63d2c6">Agentic AI &amp; LLM Systems  ·  Production Software  ·  AI Training Data</text>
    </g>

    <!-- Accent hairline -->
    <rect x="70" y="202" width="560" height="1.5" fill="url(#accentLine)" />

    <!-- Bottom highlights -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#ffffff" fill-opacity="0.82">
      <text x="70" y="238">Java 21 · Oracle DB · Gemma 4 · Claude Code · Codex · MCP · SWE-Bench Pro</text>
      <text x="70" y="266" fill="#ffffff" fill-opacity="0.58">B.Sc. CSE, University of Dhaka  |  Published on arXiv  |  sajibsahacsedu.github.io</text>
    </g>
  </g>

  <!-- Crisp outer border -->
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" />
</svg>
